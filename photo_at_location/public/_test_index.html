<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Photo at Location</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>在地點生成旅遊照片（4K）</h1>

      <label>Google Maps API Key： <input id="gmKey" placeholder="輸入 Google Maps API Key"></label>
      <button id="loadMap">載入地圖</button>

      <div id="map" style="height:400px;margin-top:8px"></div>

      <div class="controls">
        <label>上傳參考照片： <input id="photo" type="file" accept="image/*"></label>
        <label>Gemini API Key： <input id="geminiKey" placeholder="輸入 Gemini API Key"></label>
        <button id="generate">產生 4K 照片</button>
      </div>

      <h3>結果預覽</h3>
      <canvas id="canvas" width="960" height="540"></canvas>
      <div id="status"></div>
    </div>

    <script src="/app.js"></script>
  </body>
  </html>
